[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-aer-york-opencl"
version = "0.2.0"
description = "Optional cross-vendor OpenCL statevector plugin for York Aer"
requires-python = ">=3.10"
dependencies = ["qiskit-aer-york-core>=0.1,<0.2", "qiskit-aer-york-qiskit>=0.1,<0.2", "pyopencl>=2024.3,<2027"]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]

[project.entry-points."qiskit_aer_york.accelerators"]
opencl = "qiskit_aer_york_opencl:OpenCLProvider"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."qiskit_aer_york.engines"]
opencl = "qiskit_aer_york_opencl:OpenCLEngine"
