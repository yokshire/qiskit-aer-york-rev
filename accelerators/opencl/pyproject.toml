[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-aer-york-opencl"
version = "0.1.0"
description = "Optional cross-vendor OpenCL statevector plugin for York Aer"
requires-python = ">=3.10"
dependencies = ["qiskit-aer-york-rev>=0.17.2.post2.dev0,<0.18", "pyopencl>=2024.3,<2027"]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]

[project.entry-points."qiskit_aer_york.accelerators"]
opencl = "qiskit_aer_york_opencl:OpenCLProvider"

[tool.setuptools.packages.find]
where = ["src"]
