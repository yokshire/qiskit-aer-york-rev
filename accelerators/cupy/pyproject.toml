[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-aer-york-cupy"
version = "0.2.0"
description = "Optional CUDA and ROCm statevector plugins for York Aer"
requires-python = ">=3.10"
dependencies = ["qiskit-aer-york-core>=0.1,<0.2", "qiskit-aer-york-qiskit>=0.1,<0.2"]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x[ctk]>=13.3,<15"]
# Install a CuPy HIP build matching the AMD SDK separately; never install CUDA for ROCm.

[project.entry-points."qiskit_aer_york.accelerators"]
cuda = "qiskit_aer_york_cupy:CUDAProvider"
rocm = "qiskit_aer_york_cupy:ROCmProvider"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."qiskit_aer_york.engines"]
cuda = "qiskit_aer_york_cupy:CUDAEngine"
rocm = "qiskit_aer_york_cupy:ROCmEngine"
