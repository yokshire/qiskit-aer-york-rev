[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-aer-york-pyscf"
version = "0.1.0"
description = "Optional isolated PySCF worker with native Windows x64, Linux and macOS execution"
requires-python = ">=3.10"
dependencies = ["qiskit-aer-york-core>=0.1,<0.2"]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]

[project.optional-dependencies]
data = ["qiskit-aer-york-data>=0.1,<0.2"]
# Only opt in on platforms with native PySCF packages. Use binary-only installs.
native = [
  "pyscf>=2.8,<3; platform_system == 'Linux' or platform_system == 'Darwin'",
  "pyscf>=2.15.1,<3; platform_system == 'Windows' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]

[project.entry-points."qiskit_aer_york.drivers"]
pyscf = "qiskit_aer_york_pyscf:PySCFDriver"

[tool.setuptools.packages.find]
where = ["src"]
