---
features:
  - |
    York's default ``qiskit-aer-york-rev`` distribution is the general-purpose
    CPU simulator, with CUDA acceleration retained as an optional separate
    build. A Python build-and-verification helper replaces the Bash-only CPU
    path and protects CPU builds from inherited CUDA settings. Hosted checks
    now cover Windows and macOS CPU builds in addition to the Linux Python
    matrix, noise models, all general-purpose CPU simulation methods, and
    Aer/IBM Runtime local primitives.
